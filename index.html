            font-size: 16px;
            font-weight: 600;

        }
        .btn:hover {

        }
        .btn:active {

            color: white;
            font-size: 14px;
            z-index: 200;

        }
        .status.error {
            background: #f44336;
        }
        .status.info {
            background: #2196F3;
        }

            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }

            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;

    <div class="container">
        <!-- Login pagina -->
        <div id="loginPage" class="page active">
            <div class="login-card">
                <h1>⛳ Bunker Tracker V28.2</h1>
                <p>Locaties vastleggen op de golfbaan</p>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="nameInput">Wat is je naam?</label>
                        <input 
                            type="text" 
                            id="nameInput" 
                            placeholder="Voer je naam in..." 
                            required
                            autocomplete="off"
                        >
                    </div>
                    <button type="submit" class="btn">Inloggen</button>
                </form>
            </div>
        </div>
        
        <!-- Kaart pagina -->
        <div id="mapPage" class="page">
            <div class="map-header">
                <div>
                    <h2 id="userName">Welkom!</h2>
                </div>
                <div>
                    <button class="btn-small secondary" onclick="goToList()">📋 Lijst</button>
                    <button class="btn-small secondary" onclick="logout()" style="margin-left: 8px;">🚪 Logout</button>
                </div>
            </div>
            <div id="mapContainer"></div>
            <div class="location-info">
                <div id="locationText">Locatie laden...</div>
            </div>
        </div>
        
        <!-- Lijst pagina -->
        <div id="listPage" class="page">
            <div class="list-header">
                <h2>📋 Opgeslagen locaties</h2>
                <button class="btn-small secondary" onclick="goToMap()">🗺️ Kaart</button>
            </div>
            <div id="listContainer" class="list-container"></div>
        </div>
    </div>
    
    <!-- Bevestigings dialoog -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="confirmModalTitle">Bunker toevoegen?</h3>
            <p id="confirmModalQuestion">Wil je deze bunker toevoegen aan je lijst?</p>
            <div class="modal-info" id="modalInfo"></div>
            <div class="boolean-choice">
                <div class="boolean-choice-title">Bruning?</div>
                <div class="boolean-choice-options">
                    <label>
                        <input type="radio" name="bruningInput" value="true">
                        Ja
                    </label>
                    <label>
                        <input type="radio" name="bruningInput" value="false" checked>
                        Nee
                    </label>
                </div>
            </div>
            <div class="aantal-choice" id="aantalChoice" style="display: none;">
                <div class="aantal-choice-title">Aantal?</div>
                <input type="number" id="aantalInput" min="1" max="9" step="1" value="1">
            </div>
            <div class="person-choice">
                <div class="person-choice-title">Wie?</div>
                <select id="whoInput" size="5" required></select>
            </div>
            <div class="modal-buttons">
                <button class="btn-yes" onclick="confirmSaveLocation(true)">Opslaan</button>
                <button class="btn-no" onclick="confirmSaveLocation(false)">Annuleren</button>
            </div>
        </div>
    </div>
    
    <!-- Status bericht -->
    <div id="statusMessage" class="status"></div>

        let pendingLocation = null;
        let defaultMapLocationUsed = false;
        
        // Login
        function handleLogin(event) {
            event.preventDefault();
            const enteredName = document.getElementById('nameInput').value;
            const allowedName = getAllowedUserName(enteredName);
            if (!allowedName) {
                showStatus('Deze naam staat niet op de whitelist', 'error');
                document.getElementById('nameInput').focus();
                return;
            }
            
            currentUser = allowedName;
            saveLastUserName(allowedName);
            document.getElementById('loginForm').reset();
            showPage('mapPage');
            document.getElementById('userName').textContent = `Welkom, ${allowedName}!`;
            initMap();
        }
        
        function saveLastUserName(name) {
            try {
                localStorage.setItem(LAST_USER_KEY, name);
            } catch (e) {
                console.warn('Kon laatst gebruikte naam niet opslaan:', e);
            }
        }

        function getLastUserName() {
            try {
                return localStorage.getItem(LAST_USER_KEY) || '';
            } catch (e) {
                console.warn('Kon laatst gebruikte naam niet laden:', e);
                return '';
            }
        }

        function startWithLastUserName() {
            const lastName = getLastUserName();
            const nameInput = document.getElementById('nameInput');
            if (!lastName) {
                nameInput.focus();
                return;
            }

            const allowedName = getAllowedUserName(lastName);
            if (!allowedName) {
                nameInput.value = '';
                nameInput.focus();
                return;
            }

            nameInput.value = allowedName;
            currentUser = allowedName;
            showPage('mapPage');
            document.getElementById('userName').textContent = `Welkom, ${allowedName}!`;
            initMap();
        }

        function logout() {
            if (confirm('Zeker weten dat je uit wilt loggen?')) {
                currentUser = null;
                map = null;
                userMarker = null;
                savedMarkers = [];
                showPage('loginPage');
                document.getElementById('nameInput').focus();
            }
        }
        
        // Pagina navigatie
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            if (pageId === 'mapPage' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
            if (pageId === 'listPage') {
                renderList();
            }
        }
        
        function goToMap() {
            showPage('mapPage');
        }
        
        function goToList() {
            showPage('listPage');
        }
        
        // Kaart
        function initMap() {
            if (map) return;
            
            const mapContainer = document.getElementById('mapContainer');
            map = L.map(mapContainer, {
                dragging: true,
                touchZoom: true,
                doubleClickZoom: true,
                scrollWheelZoom: false
            }).setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
            useDefaultMapLocation();
            
            // Kaartlagen
            const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
                name: 'Open Streetmap'
            });
            
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '© Esri',
                maxZoom: 19,
                name: 'Satelliet'
            });
            
            // Satellietlaag standaard tonen
            satelliteLayer.addTo(map);
            
            // Layer control
            const baseLayers = {
                '🛰️ Satelliet': satelliteLayer,
                '🗺️ Open Streetmap': osmLayer
            };
            
            L.control.layers(baseLayers, {}, { position: 'topright' }).addTo(map);
            
            // Referentiepunten — in een aparte LayerGroup zodat deze
            // altijd boven de GPS-positiemarker wordt gerenderd.
            bunkerLayer = L.layerGroup().addTo(map);

            referencePoints.forEach(point => {
                const marker = L.circleMarker([point.lat, point.lng], {
                    radius: 8,
                    fillColor: '#9C27B0',
                    color: '#7B1FA2',
                    weight: 2,
                    opacity: 0.9,
                    fillOpacity: 0.65,
                    bubblingMouseEvents: false
                }).addTo(bunkerLayer);

                marker.bindTooltip(point.name, {
                    permanent: false,
                    direction: 'top'
                });

                marker.on('click', function(e) {
                    // Voorkom dat de kaartklik of Leaflet-popup de actie verstoort.
                    if (e && e.originalEvent) {
                        L.DomEvent.stopPropagation(e);
                        L.DomEvent.preventDefault(e);
                    }

                    addReferencePointAfterConfirm(point);
                });
            });
            
            // Alleen bestaande punten kunnen aan de lijst worden toegevoegd.
            // Een vrije klik op de kaart slaat dus geen locatie meer op.
            
            // Gebruiker locatie
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    position => {
                        const { latitude, longitude } = position.coords;
                        updateUserLocation(latitude, longitude);
                    },
                    error => {
                        useDefaultMapLocation();
                        showStatus('GPS niet beschikbaar', 'info');
                        console.error('Geolocation error:', error);
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 8000
                    }
                );
            } else {
                useDefaultMapLocation();
                showStatus('GPS niet beschikbaar', 'info');
            }
        }
        
        function useDefaultMapLocation() {
            if (!map || defaultMapLocationUsed) return;
            defaultMapLocationUsed = true;
            map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
            document.getElementById('locationText').innerHTML =
                `Standaardpositie: 📍 ${DEFAULT_LAT.toFixed(4)}, ${DEFAULT_LNG.toFixed(4)}`;
        }

        function updateUserLocation(lat, lng) {
            if (!map) return;
            
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.circle([lat, lng], {
                    radius: 10,
                    fillColor: '#667eea',
                    color: '#5568d3',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map);
                // Zorg dat de bunkerlaag altijd boven de GPS-marker blijft
                if (bunkerLayer) bunkerLayer.bringToFront();
            }
            
            document.getElementById('locationText').innerHTML = 
                `📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
        
        function addReferencePointAfterConfirm(point) {
            const allowedName = getAllowedUserName(currentUser);
            if (!allowedName) {
                showStatus('Je naam staat niet op de whitelist', 'error');
                showPage('loginPage');
                document.getElementById('nameInput').focus();
                return;
            }
            currentUser = allowedName;

            pendingLocation = {
                lat: point.lat,
                lng: point.lng,
                pointName: point.name,
                timestamp: new Date(),
                isReferencePoint: true
            };

            showAddPointModal(point);
        }

        function populateWhoSelect(selectedName) {
            const select = document.getElementById('whoInput');
            if (!select) return;

            const normalizedSelectedName = getAllowedUserName(selectedName) || getAllowedUserName(currentUser) || ALLOWED_USERS[0];
            select.innerHTML = ALLOWED_USERS.map(name => {
                const selected = name === normalizedSelectedName ? ' selected' : '';
                return `<option value="${escapeHtml(name)}"${selected}>${escapeHtml(name)}</option>`;
            }).join('');
        }

        function showAddPointModal(point) {
            const timestamp = pendingLocation && pendingLocation.timestamp instanceof Date
                ? pendingLocation.timestamp
                : new Date();

            document.getElementById('confirmModalTitle').textContent = 'Bunker toevoegen?';
            document.getElementById('confirmModalQuestion').textContent = 'Wil je deze bunker toevoegen aan je lijst?';
            document.getElementById('modalInfo').innerHTML =
                `<strong>Naam:</strong> ${escapeHtml(currentUser || '-')}<br>` +
                `<strong>Punt:</strong> ${escapeHtml(point.name)}<br>` +
                `<strong>Datum/tijd:</strong> ${timestamp.toLocaleString('nl-NL', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}`;

            const defaultBruningInput = document.querySelector('input[name="bruningInput"][value="false"]');
            if (defaultBruningInput) defaultBruningInput.checked = true;

            const aantalInputReset = document.getElementById('aantalInput');
            if (aantalInputReset) aantalInputReset.value = 1;
            updateAantalVisibility();

            populateWhoSelect(currentUser);

            document.getElementById('confirmModal').classList.add('active');
        }

        function updateAantalVisibility() {
            const aantalChoice = document.getElementById('aantalChoice');
            const checkedInput = document.querySelector('input[name="bruningInput"]:checked');
            const isJa = !!checkedInput && checkedInput.value === 'true';
            if (aantalChoice) aantalChoice.style.display = isJa ? 'block' : 'none';
        }

        document.querySelectorAll('input[name="bruningInput"]').forEach(input => {
            input.addEventListener('change', updateAantalVisibility);
        });

        function checkNearbyPoints(lat, lng) {
            const RADIUS = 30; // meters
            const earthRadiusM = 6371000;
            
            let nearby = [];
            referencePoints.forEach(point => {
                const dLat = (point.lat - lat) * Math.PI / 180;
                const dLng = (point.lng - lng) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                         Math.cos(lat * Math.PI / 180) * Math.cos(point.lat * Math.PI / 180) *
                         Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                const distance = earthRadiusM * c;
                
                if (distance <= RADIUS) {
                    nearby.push({ ...point, distance: Math.round(distance) });
                }
            });
            
            let info = `<strong>Coördinaten:</strong><br>
                       ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            
            if (nearby.length > 0) {
                info += `<br><br><strong style="color: #2196F3;">Dichtbij:</strong><br>`;
                nearby.forEach(p => {
                    info += `• ${p.name} (${p.distance}m)<br>`;
                });
            }
            
            document.getElementById('modalInfo').innerHTML = info;
        }
        
        function confirmSaveLocation(confirmed) {
            document.getElementById('confirmModal').classList.remove('active');
            
            if (confirmed && pendingLocation) {
                const selectedBruningInput = document.querySelector('input[name="bruningInput"]:checked');
                pendingLocation.bruning = selectedBruningInput
                    ? selectedBruningInput.value === 'true'
                    : false;

                if (pendingLocation.bruning) {
                    const aantalInputEl = document.getElementById('aantalInput');
                    let aantal = parseInt(aantalInputEl ? aantalInputEl.value : '1', 10);
                    if (!Number.isFinite(aantal) || aantal < 1) aantal = 1;
                    if (aantal > 9) aantal = 9;
                    pendingLocation.bruningAantal = aantal;
                } else {
                    pendingLocation.bruningAantal = 0;
                }

                const whoSelect = document.getElementById('whoInput');
                const selectedWho = whoSelect ? getAllowedUserName(whoSelect.value) : null;
                if (!selectedWho) {
                    showStatus('Kies een geldige naam bij Wie?', 'error');
                    pendingLocation = null;
                    return;
                }
                pendingLocation.who = selectedWho;

                saveLocation(pendingLocation);
            }
            
            pendingLocation = null;
        }
        
        async function saveLocation(location) {
            const allowedName = getAllowedUserName(currentUser);
            if (!allowedName) {
                showStatus('Opslaan geweigerd: naam staat niet op de whitelist', 'error');
                return;
            }

            const timestamp = location.timestamp instanceof Date ? location.timestamp : new Date();
            const record = {
                user: allowedName,
                pointName: location.pointName || 'Onbekend punt',
                lat: Number(location.lat),
                lng: Number(location.lng),
                timestamp: timestamp.toISOString(),
                bruning: Boolean(location.bruning),
                bruningAantal: location.bruning ? (Number(location.bruningAantal) || 1) : 0,
                who: getAllowedUserName(location.who) || allowedName,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await locationsCollection.add(record);
                showStatus(`Toegevoegd: ${record.pointName}`, 'success');
                renderList();
                if (map) map.invalidateSize();
            } catch (err) {
                showStatus('Fout bij opslaan in Firebase', 'error');
                console.error('Firestore save error:', err);
            }
        }
        
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Locaties laden...</p></div>';
            
            try {
                const snapshot = await locationsCollection.orderBy('timestamp', 'desc').get();
                const locations = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                if (locations.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Nog geen locaties vastgelegd</p></div>';
                    return;
                }
                
                container.innerHTML = locations.map(loc => {
                    const date = new Date(loc.timestamp);
                    const safePointName = escapeHtml(loc.pointName || loc.label || 'Onbekend punt');
                    const safeUser = escapeHtml(loc.user || '-');
                    const safeLat = Number(loc.lat).toFixed(6);
                    const safeLng = Number(loc.lng).toFixed(6);
                    const safeId = escapeHtml(loc.id);
                    const bruningText = typeof loc.bruning === 'boolean'
                        ? (loc.bruning
                            ? `Ja (Aantal: ${Number.isFinite(Number(loc.bruningAantal)) && Number(loc.bruningAantal) > 0 ? Number(loc.bruningAantal) : 1})`
                            : 'Nee')
                        : 'Niet vastgelegd';
                    const safeWho = escapeHtml(loc.who || 'Niet vastgelegd');

                    return `
                        <div class="list-item">
                            <div class="list-item-info">
                                <h3>${safePointName}</h3>
                                <p>👤 ${safeUser}</p>
                                <p>📍 ${safeLat}, ${safeLng}</p>
                                <p>Bruning: ${bruningText}</p>
                                <p>Wie: ${safeWho}</p>
                            </div>
                            <div style="flex: 1;"></div>
                            <div class="list-item-time">
                                <div class="date">${date.toLocaleDateString('nl-NL')}</div>
                                <div class="time">${date.toLocaleTimeString('nl-NL', {hour: '2-digit', minute:'2-digit'})}</div>
                            </div>
                            <!-- Verwijderen is bewust uitgeschakeld in de veilige whitelist-versie. -->
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><p>Fout bij laden van locaties uit Firebase</p></div>';
                showStatus('Fout bij laden uit Firebase', 'error');
                console.error('Firestore load error:', err);
            }
        }
        
        async function deleteLocation(id) {
            showStatus('Verwijderen is uitgeschakeld in de veilige whitelist-versie', 'info');
        }
        
        // Status bericht
        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status ${type}`;
            setTimeout(() => {
                el.className = 'status';
            }, 3000);
        }
        
        // Init
        startWithLastUserName();
